# shellcheck shell=bash disable=SC2034
# =============================================================================
#  CitizenTech - Configuração central da infraestrutura Linux
# -----------------------------------------------------------------------------
#  TODOS os scripts leem este arquivo. Para mudar o ambiente, altere aqui e
#  execute novamente os scripts (eles são idempotentes).
#  Após o provisionamento, uma cópia fica em /etc/citizentech/citizentech.conf
#  (é ela que os serviços systemd utilizam).
# =============================================================================

# ---- Identificação do servidor ---------------------------------------------
CT_HOSTNAME="citizentech-srv"
CT_DOMAIN="citizentech.local"
CT_TIMEZONE="America/Sao_Paulo"

# ---- Rede -------------------------------------------------------------------
# Rede interna de serviços: interface virtual dedicada (ct0) com IP FIXO.
# A aplicação escuta somente neste IP; o Nginx publica a aplicação na porta 80.
CT_SVC_IFACE="ct0"
CT_SVC_IP="10.77.0.10"
CT_SVC_PREFIX="24"

# Interface principal (somente VM / Azure - no WSL o IP principal é do Windows).
#   NET_MODE=dhcp   -> mantém DHCP (recomendado para Azure e NAT do VirtualBox)
#   NET_MODE=static -> aplica IP fixo via netplan na interface NET_IFACE
#   Exemplo VirtualBox (2ª placa "Host-only"):
#     NET_MODE="static"; NET_IFACE="enp0s8"; NET_ADDRESS="192.168.56.10/24"; NET_GATEWAY=""
NET_MODE="dhcp"
NET_IFACE=""                       # vazio = interface da rota padrão
NET_ADDRESS="192.168.56.10/24"
NET_GATEWAY=""                     # vazio = não altera a rota padrão

# ---- DNS --------------------------------------------------------------------
DNS_SERVERS="1.1.1.1 8.8.8.8"
DNS_FALLBACK="9.9.9.9 8.8.4.4"
DNS_TEST_NAME="github.com"         # nome usado para validar a resolução

# ---- Firewall (ufw): auto = liga em VM/Azure e não altera no WSL ------------
FIREWALL="auto"

# ---- Usuários e grupos ------------------------------------------------------
CT_APP_USER="citizentech"          # usuário de sistema que executa a aplicação
CT_OPS_GROUP="citizentech-ops"     # grupo de operadores (lê logs, gerencia serviços)
CT_OPS_USER="ctops"                # usuário operador criado para a equipe

# ---- Diretórios -------------------------------------------------------------
CT_HOME="/opt/citizentech"         # binários, scripts e código da aplicação
CT_ETC="/etc/citizentech"          # configuração e variáveis de ambiente
CT_DATA="/var/lib/citizentech"     # dados (banco SQLite) e estado dos serviços
CT_STATE_DIR="/var/lib/citizentech/state"
CT_LOG_DIR="/var/log/citizentech"  # todos os logs do projeto
CT_BACKUP_DIR="/var/backups/citizentech"

# ---- Aplicação Web ----------------------------------------------------------
APP_NAME="citizentech-app"
APP_RUNTIME="python"               # python | node | dotnet
APP_SOURCE="local"                 # local = pasta app/ deste repositório | git
APP_GIT_URL=""                     # ex.: https://github.com/equipe/citizentech-api.git
APP_GIT_BRANCH="main"
APP_SUBDIR=""                      # subpasta do repositório git onde está a aplicação
APP_PORT="8000"
APP_HEALTH_PATH="/health"
APP_ENV="production"
APP_WSGI="app:app"                 # (python) módulo:objeto WSGI
APP_DOTNET_PROJECT=""              # (dotnet) caminho do .csproj; vazio = detecta
APP_START_CMD=""                   # vazio = comando padrão do runtime
# Variáveis extras da aplicação (ex.: string de conexão do banco da disciplina de SOA/C#)
APP_EXTRA_ENV=(
  # "ConnectionStrings__Default=Data Source=/var/lib/citizentech/db/app.db"
)

# ---- Monitoramento ----------------------------------------------------------
# Os limites aceitam sobrescrita por variável de ambiente (ex.: CPU_WARN=50 ct-monitor)
MONITOR_INTERVAL="${MONITOR_INTERVAL:-15}"   # segundos entre verificações
CPU_SAMPLE_SECONDS="${CPU_SAMPLE_SECONDS:-1}"
CPU_WARN="${CPU_WARN:-70}";   CPU_CRIT="${CPU_CRIT:-90}"
MEM_WARN="${MEM_WARN:-75}";   MEM_CRIT="${MEM_CRIT:-90}"
DISK_WARN="${DISK_WARN:-80}"; DISK_CRIT="${DISK_CRIT:-90}"
DISK_MOUNTS="${DISK_MOUNTS:-/}"              # pontos de montagem monitorados
HEALTHCHECK_EVERY="30s"                      # frequência do watchdog (systemd timer)
LOG_RETENTION_DAYS="14"
