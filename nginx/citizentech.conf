# =============================================================================
# CitizenTech - Nginx como proxy reverso para a aplicação
# Template: os campos delimitados por '@' são preenchidos por 02-provision-app.sh
# =============================================================================
upstream citizentech_app {
    server @CT_SVC_IP@:@APP_PORT@ max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80 default_server;
    @NGINX_LISTEN_V6@
    server_name @CT_DOMAIN@ www.@CT_DOMAIN@ @CT_HOSTNAME@ localhost _;

    access_log /var/log/nginx/citizentech_access.log;
    error_log  /var/log/nginx/citizentech_error.log warn;

    server_tokens off;
    client_max_body_size 5m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://citizentech_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Verificação do próprio Nginx (independe da aplicação)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Página amigável enquanto a aplicação se recupera de uma falha
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/citizentech;
        internal;
    }
}
