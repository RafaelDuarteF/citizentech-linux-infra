# =============================================================================
# CitizenTech - drop-in para o nginx.service
# Instalado em /etc/systemd/system/nginx.service.d/10-citizentech.conf
# O pacote nginx não reinicia sozinho em caso de falha; aqui habilitamos isso.
# =============================================================================
[Unit]
StartLimitIntervalSec=120
StartLimitBurst=10

[Service]
Restart=on-failure
RestartSec=3
